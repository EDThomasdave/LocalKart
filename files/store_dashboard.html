<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Store Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body class="bg-gray-100 p-6">

<h1 class="text-2xl font-bold mb-6">Store Manager</h1>

<!-- 🔥 TAB SWITCH -->
<div class="flex gap-4 mb-6">
  <button id="productsTab"
    class="px-4 py-2 bg-blue-500 text-white rounded">
    Products
  </button>

  <button id="ordersTab"
    class="px-4 py-2 bg-gray-200 rounded">
    Orders
  </button>
</div>

<!-- 🔥 PRODUCTS SECTION -->
<div id="productsSection">

  <!-- ADD PRODUCT -->
  <div class="bg-white p-4 rounded shadow mb-6">
    <h2 class="font-bold mb-3">Add Product</h2>

    <input id="name" type="text" placeholder="Product Name" class="border p-2 mr-2">
    <input id="price" type="number" placeholder="Price" class="border p-2 mr-2">
    <input id="image" type="file" class="border p-2 mr-2">

    <select id="tags" class="border p-2 rounded">
      <option value="">Select Category</option>
      <option value="milk">Milk</option>
      <option value="bread">Bread & Pav</option>
      <option value="eggs">Eggs</option>
      <option value="cereals">Cereals</option>
      <option value="muesli">Muesli</option>
      <option value="daily">Everyday Items</option>
    </select>

    <button onclick="addProduct()" class="bg-blue-500 text-white px-4 py-2 rounded ml-2">
      Add Product
    </button>
  </div>

  <!-- PRODUCT LIST -->
  <div class="bg-white p-4 rounded shadow">
    <h2 class="font-bold mb-3">Your Products</h2>
    <div id="productList"></div>
  </div>

</div>

<!-- 🔥 ORDERS SECTION -->
<div id="ordersSection" class="hidden">

  <div class="bg-white p-4 rounded shadow mt-6">
    <h2 class="font-bold mb-3 text-lg">Orders</h2>
    <div id="orderList" class="space-y-3"></div>
  </div>

</div>

<script>
const BASE_URL = "https://localkart-backend-hbou.onrender.com";

// STORE
const storeData = JSON.parse(localStorage.getItem("store"));
const STORE_ID = storeData?._id;

if (!storeData || !STORE_ID) {
  alert("Login required");
  window.location.href = "store_login.html";
}

// =======================
// 🔄 TAB SWITCH LOGIC
// =======================
const productsTab = document.getElementById("productsTab");
const ordersTab = document.getElementById("ordersTab");

const productsSection = document.getElementById("productsSection");
const ordersSection = document.getElementById("ordersSection");

productsTab.onclick = () => {
  productsSection.classList.remove("hidden");
  ordersSection.classList.add("hidden");

  productsTab.classList.add("bg-blue-500", "text-white");
  productsTab.classList.remove("bg-gray-200");

  ordersTab.classList.remove("bg-blue-500", "text-white");
  ordersTab.classList.add("bg-gray-200");
};

ordersTab.onclick = () => {
  productsSection.classList.add("hidden");
  ordersSection.classList.remove("hidden");

  ordersTab.classList.add("bg-blue-500", "text-white");
  ordersTab.classList.remove("bg-gray-200");

  productsTab.classList.remove("bg-blue-500", "text-white");
  productsTab.classList.add("bg-gray-200");

  loadOrders(); // 🔥 load only when clicked
};

// =======================
// 📦 PRODUCTS
// =======================
async function loadProducts() {
  const res = await fetch(`${BASE_URL}/api/products/store/${STORE_ID}`);
  const products = await res.json();

  const container = document.getElementById("productList");
  container.innerHTML = "";

  products.forEach(p => {
    container.innerHTML += `
      <div class="border p-3 mb-2 flex justify-between items-center">
        <div class="flex gap-3 items-center">
          <img src="${p.image}" width="50">
          <div>
            <p class="font-bold">${p.name}</p>
            <p>₹${p.price}</p>
          </div>
        </div>

        <button onclick="deleteProduct('${p._id}')" 
          class="bg-red-500 text-white px-3 py-1 rounded">
          Delete
        </button>
      </div>
    `;
  });
}

// ADD PRODUCT
async function addProduct() {
  const name = document.getElementById("name").value;
  const price = document.getElementById("price").value;
  const image = document.getElementById("image").files[0];
  const tag = document.getElementById("tags").value;

  if (!name || !price || !image || !tag) {
    alert("Fill all fields ❌");
    return;
  }

  const formData = new FormData();
  formData.append("name", name);
  formData.append("price", price);
  formData.append("image", image);
  formData.append("tags", tag);
  formData.append("store", STORE_ID);

  try {
    const res = await fetch(`${BASE_URL}/api/products`, {  // ✅ FIX HERE
      method: "POST",
      body: formData
    });

    const data = await res.json(); // 👈 useful for debugging
    console.log("RESPONSE:", data);

    if (!res.ok) {
      alert(data.msg || "❌ Failed to add product");
      return;
    }

    alert("✅ Product added");
    loadProducts();

  } catch (err) {
    console.log("ADD ERROR:", err);
    alert("Server error ❌");
  }
}

// DELETE
async function deleteProduct(id) {
  await fetch(`${BASE_URL}/api/products/${id}`, { method: "DELETE" });
  loadProducts();
}

// =======================
// 📦 ORDERS
// =======================
async function loadOrders() {
  const res = await fetch(`${BASE_URL}/api/order/store/${STORE_ID}`);
  const orders = await res.json();

  const container = document.getElementById("orderList");
  container.innerHTML = "";

  orders.forEach(o => {
    container.innerHTML += `
      <div class="border rounded-lg p-3 bg-gray-50">

        <div class="flex justify-between">
          <p class="font-bold text-sm">Order #${o._id.slice(-5)}</p>
          <span class="text-xs px-2 py-1 rounded bg-yellow-200">
            ${o.status}
          </span>
        </div>

        <ul class="text-sm mt-2">
          ${o.items.map(i => `<li>• ${i.name} x${i.quantity}</li>`).join("")}
        </ul>

        <p class="font-bold mt-2">₹${o.total}</p>

        ${
          o.status === "pending"
            ? `<button onclick="fulfillOrder('${o._id}')"
              class="bg-green-500 text-white px-3 py-1 rounded mt-2">
              Mark Fulfilled
            </button>`
            : ""
        }

      </div>
    `;
  });
}

// FULFILL
async function fulfillOrder(id) {
  await fetch(`${BASE_URL}/api/order/fulfill/${id}`, { method: "PUT" });
  loadOrders();
}

// =======================
// 🔌 SOCKET
// =======================
const socket = io(BASE_URL);

socket.on("new-order", () => {
  if (!ordersSection.classList.contains("hidden")) {
    loadOrders();
  }
});

// =======================
// INIT
// =======================
loadProducts();
</script>

</body>
</html>
