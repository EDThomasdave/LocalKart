<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Details - LocalKart</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { font-family: 'Inter', sans-serif; background-color: #a5b39c; }
</style>
</head>

<body class="p-6">

<div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow">

  <h1 class="text-2xl font-extrabold mb-4">Your Order</h1>

  <!-- ORDER INFO -->
  <div class="mb-4">
    <p id="orderId" class="font-bold"></p>
    <p id="orderStatus" class="text-sm mt-1"></p>
  </div>

  <!-- ITEMS -->
  <div>
    <h2 class="font-bold mb-2">Items</h2>
    <ul id="itemsList" class="space-y-2"></ul>
  </div>

  <!-- TOTAL -->
  <div class="mt-4 border-t pt-3">
    <p id="totalPrice" class="text-lg font-bold"></p>
  </div>

  <!-- ACTIONS -->
  <div class="mt-5 flex gap-3">

    <button id="mapBtn"
      class="bg-green-600 text-white px-4 py-2 rounded">
      Open Route Map
    </button>

    <button onclick="goHome()"
      class="bg-gray-200 px-4 py-2 rounded">
      Back to Home
    </button>

  </div>

</div>

<script>
const BASE_URL = "https://localkart-backend-hbou.onrender.com";

// 📦 GET ORDER ID FROM URL
const params = new URLSearchParams(window.location.search);
const orderId = params.get("orderId");

let storeLocation = null;

// 🔥 LOAD ORDER
async function loadOrder() {
  try {
    const res = await fetch(`${BASE_URL}/api/order/${orderId}`);
    const order = await res.json();

    console.log("ORDER:", order);

    // ORDER INFO
    document.getElementById("orderId").innerText = "Order ID: " + order._id;
    document.getElementById("orderStatus").innerText =
      "Status: " + order.status;

    // ITEMS
    const itemsContainer = document.getElementById("itemsList");
    itemsContainer.innerHTML = "";

    order.items.forEach(i => {
      itemsContainer.innerHTML += `
        <li class="flex justify-between border p-2 rounded">
          <span>${i.name} x${i.quantity}</span>
          <span>₹${i.price * i.quantity}</span>
        </li>
      `;
    });

    // TOTAL
    document.getElementById("totalPrice").innerText =
      "Total: ₹" + order.total;

    // 🔥 GET STORE LOCATION
    const res2 = await fetch(
      `${BASE_URL}/api/products?store=${order.storeId}`
    );
    const data = await res2.json();

    storeLocation = data[0]?.store?.location;

  } catch (err) {
    console.log("ORDER LOAD ERROR:", err);
  }
}

// 🗺 OPEN MAP
document.getElementById("mapBtn").onclick = () => {
  if (!storeLocation) {
    alert("Store location not available ❌");
    return;
  }

  const url = `https://www.google.com/maps/dir/?api=1&destination=${storeLocation.lat},${storeLocation.lng}`;
  window.open(url, "_blank");
};

// 🔙 BACK
function goHome() {
  window.location.href = "../index.html"; // adjust if needed
}

// 🔄 AUTO REFRESH STATUS
setInterval(loadOrder, 5000);

// 🚀 INIT
loadOrder();

</script>

</body>
</html>
